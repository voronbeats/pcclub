services:
  app:
    build: .
    container_name: laravel_app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      # Эти две переменные перекрывают значения из .env (там мог быть 127.0.1.31),
      # так что менять DB_HOST в .env вручную не обязательно.
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: laravel_db
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"   # доступ с хоста: localhost:3307
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      # MYSQL_USER здесь намеренно не задан: в .env используется root,
      # а образ MySQL не позволяет создавать "обычного" пользователя root.
    volumes:
      - laravel_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  laravel_db_data:
